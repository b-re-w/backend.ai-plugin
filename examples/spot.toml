# Spot monitor settings (docs/SPEC.md 2.2). In production put them in etcd under
# config/plugins/accelerator/gpu_spot_N/monitor/<section>/<key>; this TOML is for `labgpu-spot -c`.

[controller]
poll_interval = 5
# state_dir = "<agent var-base-path>/labgpu"   # status.json, parked.json (default)

[idle]
idle_minutes = 30
owner_util_threshold = 5
owner_mem_delta_mib = 512
owner_cpu_threshold = 0.5
unclaimed_grace_seconds = 60
ignored_processes = ["Xorg"]   # host display server on workstation GPUs is not owner activity

[reclaim]
mem_reserve_mib = 2048


[spot]
enabled = true
# cuda_checkpoint = "/path/to/cuda-checkpoint"  # default: <plugin checkout>/.venv/bin (scripts/install_cuda_checkpoint.sh)
park_seconds = 300          # wait this long off the GPU for a free one before evicting
evict_signal = "SIGINT"     # KeyboardInterrupt in Python
evict_grace_seconds = 30
