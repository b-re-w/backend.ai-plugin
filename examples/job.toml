# A spot job (see docs/SPEC.md section 2.8)
name = "resnet50-sweep"
image = "cr.backend.ai/stable/python-pytorch:2.3-py312-cuda12.4"
command = ["python", "train.py", "--resume-from", "/home/work/proj/ckpt"]
workdir = "/home/work/proj"
entrypoint = ""        # clear the image ENTRYPOINT; remove this line to keep it
gpu_mem = "20g"        # smallest GPU memory gap this job can run in
gpu_models = ["*PRO 6000*", "*PRO 5000*"]   # optional: only lend these GPU models
ram = "16g"
priority = 0
env = { WANDB_MODE = "offline" }

[[mounts]]
src = "/vfroot/local/user-xxxx/proj"
dst = "/home/work/proj"
readonly = false
